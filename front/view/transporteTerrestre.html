<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rolvin Tours - Transporte Terrestre</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="../css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-rolvin mb-4">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-water"></i>
                Rolvin Tours
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRolvin"
                aria-controls="navRolvin" aria-expanded="false" aria-label="Menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navRolvin">

                <div class="navbar-nav ms-auto gap-lg-3">
                    <a class="nav-link" href="tours.html">
                        Tours
                    </a>

                    <a class="nav-link" href="clientes.html">
                        Clientes
                    </a>

                    <a class="nav-link" href="vendedores.html">
                        Vendedores
                    </a>

                    <a class="nav-link" href="embarcaciones.html">
                        Embarcaciones
                    </a>

                    <a class="nav-link active" href="transporteTerrestre.html">
                        Transporte terrestre
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">

        <h2 class="mb-4">
            <i class="bi bi-bus-front"></i>
            Gestión de Transporte Terrestre
        </h2>

        <div id="zonaAlertas"></div>

        <div class="row g-4">

            <div class="col-lg-4">
                <div class="panel-form">

                    <h5 id="tituloFormulario" class="mb-3">
                        Nuevo transporte terrestre
                    </h5>

                    <form id="formTransporteTerrestre">

                        <div class="mb-3">
                            <label for="vehiculo" class="form-label">
                                Vehículo
                            </label>

                            <input type="text" class="form-control" id="vehiculo" placeholder="Ej. Microbús Hyundai H1"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="capacidad_pasajeros" class="form-label">
                                Capacidad de pasajeros
                            </label>

                            <input type="number" min="1" class="form-control" id="capacidad_pasajeros"
                                placeholder="Ej. 12" required>
                        </div>

                        <div class="mb-3">
                            <label for="placa" class="form-label">
                                Placa
                            </label>

                            <input type="text" class="form-control" id="placa" placeholder="Ej. SJB-4521" required>
                        </div>

                        <div class="mb-3">
                            <label for="conductor_asignado" class="form-label">
                                Conductor asignado
                            </label>

                            <input type="text" class="form-control" id="conductor_asignado"
                                placeholder="Ej. Luis Camareno" required>
                        </div>

                        <div class="mb-3">
                            <label for="rutas_frecuentes" class="form-label">
                                Rutas frecuentes
                            </label>

                            <input type="text" class="form-control" id="rutas_frecuentes"
                                placeholder="Ej. Mal País, Santa Teresa, Cóbano">

                            <div class="form-text">
                                Separa cada ruta con una coma.
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="btnGuardar" class="btn btn-teal">
                                Guardar
                            </button>

                            <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">
                                Cancelar
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="table-responsive panel-form">

                    <table class="table tabla-rolvin align-middle">
                        <thead>
                            <tr>
                                <th>Vehículo</th>
                                <th>Capacidad</th>
                                <th>Placa</th>
                                <th>Conductor</th>
                                <th>Rutas frecuentes</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaTransportesTerrestres"></tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>

    <script src="../js/model/transporteTerrestreModel.js"></script>

    <script src="../js/transporteTerrestre.js"></script>

</body>

</html>
