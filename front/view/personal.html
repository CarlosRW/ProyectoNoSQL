<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rolvin Tours - Personal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="../css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-rolvin mb-4">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-water"></i>
                Rolvin Tours
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRolvin"
                aria-controls="navRolvin" aria-expanded="false" aria-label="Menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navRolvin">

                <div class="navbar-nav ms-auto gap-lg-3">
                    <a class="nav-link" href="tours.html">Tours</a>
                    <a class="nav-link" href="clientes.html">Clientes</a>
                    <a class="nav-link active" href="vendedores.html">Vendedores</a>
                    <a class="nav-link" href="embarcaciones.html">Embarcaciones</a>
                    <a class="nav-link" href="transporteTerrestre.html">Transporte terrestre</a>
                    <a class="nav-link active" href="personal.html">Personal</a>
                    <a class="nav-link" href="reservas.html">Reservas</a>
                    <a class="nav-link" href="salidasOperaciones.html">Operaciones</a>
                    <a class="nav-link" href="costosVariables.html">Costos variables</a>
                    <a class="nav-link" href="comisionesLiquidacion.html">Comisiones</a>
                    <a class="nav-link" href="usuariosSistema.html">Usuarios</a>
                    <a class="nav-link" href="historicoKpis.html">Indicadores</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">

        <h2 class="mb-4">
            <i class="bi bi-person-vcard"></i>
            Gestión de Personal
        </h2>

        <div id="zonaAlertas"></div>

        <div class="row g-4">

            <div class="col-lg-4">
                <div class="panel-form">

                    <h5 id="tituloFormulario" class="mb-3">

                        Nuevo colaborador
                    </h5>

                    <form id="formPersonal">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">

                                Nombre completo
                            </label>

                            <input type="text" class="form-control" id="nombre" placeholder="Ej. Kevin Camareno"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="puesto" class="form-label">

                                Puesto
                            </label>

                            <select class="form-select" id="puesto" required>

                                <option value="" selected disabled>
                                    Seleccione un puesto
                                </option>

                                <option value="Capitán">
                                    Capitán
                                </option>

                                <option value="Guía turístico">
                                    Guía turístico
                                </option>

                                <option value="Administración">
                                    Administración
                                </option>

                                <option value="Conductor">
                                    Conductor
                                </option>

                                <option value="Mantenimiento">
                                    Mantenimiento
                                </option>

                                <option value="Otro">
                                    Otro
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="idiomas" class="form-label">

                                Idiomas
                            </label>

                            <input type="text" class="form-control" id="idiomas" placeholder="Ej. Español, Inglés">

                            <div class="form-text">
                                Separa cada idioma con una coma.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="cedula" class="form-label">

                                Cédula
                            </label>

                            <input type="text" class="form-control" id="cedula" placeholder="Ej. 6-0345-0987" required>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_contratacion" class="form-label">

                                Fecha de contratación
                            </label>

                            <input type="date" class="form-control" id="fecha_contratacion" required>
                        </div>

                        <div class="mb-3">
                            <label for="salario_base" class="form-label">

                                Salario base
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">₡</span>

                                <input type="number" min="0" step="1000" class="form-control" id="salario_base"
                                    placeholder="Ej. 450000" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit" id="btnGuardar" class="btn btn-teal">

                                Guardar
                            </button>

                            <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">

                                Cancelar
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="table-responsive panel-form">

                    <table class="table tabla-rolvin align-middle">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Puesto</th>
                                <th>Idiomas</th>
                                <th>Cédula</th>
                                <th>Contratación</th>
                                <th>Salario</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaPersonal"></tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>

    <script src="../js/model/personalModel.js"></script>

    <script src="../js/personal.js"></script>

</body>

</html>
