  <link href="../css/style.css" rel="stylesheet">
</head>

      <a class="navbar-brand" href="index.html"><i class="bi bi-water"></i> Rolvin Tours</a>

        <div class="navbar-nav ms-auto gap-lg-3">

  <div class="container">
    <h2 class="mb-4"><i class="bi bi-receipt-cutoff"></i> Gestión de Comisiones y Liquidaciones</h2>

    <div id="zonaAlertas"></div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="panel-form">
          <h5 id="tituloFormulario" class="mb-3">Nueva comisión o liquidación</h5>
          <form id="formComision">
            <div class="mb-3">
              <label for="vendedor_id" class="form-label">Vendedor</label>
              <select class="form-select" id="vendedor_id" required>
                <option value="" selected disabled>Seleccione un vendedor</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="reserva_id" class="form-label">Reserva</label>
              <select class="form-select" id="reserva_id" required>
                <option value="" selected disabled>Seleccione una reserva</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="monto_comision" class="form-label">Monto de la comisión</label>
              <input type="number" min="0" step="0.01" class="form-control" id="monto_comision" placeholder="Ej. 26" required>
            </div>

            <div class="mb-3">
              <label for="estado" class="form-label">Estado</label>
              <select class="form-select" id="estado" required>
                <option value="pendiente">Pendiente</option>
                <option value="liquidada">Liquidada</option>
                <option value="anulada">Anulada</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="fecha_generada" class="form-label">Fecha generada</label>
              <input type="date" class="form-control" id="fecha_generada" required>
            </div>

            <div class="mb-3 d-none" id="contenedorFechaLiquidada">
              <label for="fecha_liquidada" class="form-label">Fecha liquidada</label>
              <input type="date" class="form-control" id="fecha_liquidada">
            </div>

            <div class="d-flex gap-2">
              <button type="submit" id="btnGuardar" class="btn btn-teal">Guardar</button>
              <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="table-responsive panel-form">
          <table class="table tabla-rolvin align-middle">
            <thead>
              <tr>
                <th>Vendedor</th>
                <th>Reserva</th>
                <th>Monto</th>
                <th>Estado</th>
                <th>Generada</th>
                <th>Liquidada</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaComisiones"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>

  <script src="../js/comisionesLiquidacion.js"></script>
