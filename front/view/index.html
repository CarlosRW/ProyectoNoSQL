<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolvin Tours - Panel de Gestión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-rolvin mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-water"></i> Rolvin Tours</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-1">Panel de Gestión</h2>
    <p class="text-muted mb-4">Selecciona el módulo que quieres administrar.</p>

    <div class="row g-4">
      <div class="col-md-3 col-sm-6">
        <a href="tours.html" class="text-decoration-none text-dark">
          <div class="card card-modulo text-center p-4">
            <div class="icono mb-2"><i class="bi bi-compass"></i></div>
            <h5>Tours</h5>
            <p class="text-muted small mb-0">Catálogo de paquetes turísticos</p>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="clientes.html" class="text-decoration-none text-dark">
          <div class="card card-modulo text-center p-4">
            <div class="icono mb-2"><i class="bi bi-people"></i></div>
            <h5>Clientes</h5>
            <p class="text-muted small mb-0">Registro de turistas</p>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="vendedores.html" class="text-decoration-none text-dark">
          <div class="card card-modulo text-center p-4">
            <div class="icono mb-2"><i class="bi bi-person-badge"></i></div>
            <h5>Vendedores</h5>
            <p class="text-muted small mb-0">Comisionistas externos</p>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="embarcaciones.html" class="text-decoration-none text-dark">
          <div class="card card-modulo text-center p-4">
            <div class="icono mb-2"><i class="bi bi-ship"></i></div>
            <h5>Embarcaciones</h5>
            <p class="text-muted small mb-0">Flota marítima</p>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="transporteTerrestre.html" class="text-decoration-none text-dark">

          <div class="card card-modulo text-center p-4">
            <div class="icono mb-2">
              <i class="bi bi-bus-front"></i>
            </div>

            <h5>Transporte terrestre</h5>

            <p class="text-muted small mb-0">
              Vehículos y rutas terrestres
            </p>
          </div>
        </a>
      </div>
      







    </div>
  </div>

</body>

</html>
