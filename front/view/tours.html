<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolvin Tours - Tours</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-rolvin mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-water"></i> Rolvin Tours</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRolvin" aria-controls="navRolvin" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navRolvin">
        <div class="navbar-nav ms-auto gap-lg-3">
          <a class="nav-link active" href="tours.html">Tours</a>
          <a class="nav-link" href="clientes.html">Clientes</a>
          <a class="nav-link" href="vendedores.html">Vendedores</a>
          <a class="nav-link" href="embarcaciones.html">Embarcaciones</a>
          <a class="nav-link" href="transporteTerrestre.html">Transporte terrestre</a>
          <a class="nav-link" href="personal.html">Personal</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4"><i class="bi bi-compass"></i> Catálogo de Tours</h2>

    <div id="zonaAlertas"></div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="panel-form">
          <h5 id="tituloFormulario" class="mb-3">Nuevo tour</h5>
          <form id="formTour">
            <div class="mb-3">
              <label class="form-label">Nombre del tour</label>
              <input type="text" class="form-control" id="nombre_tour" placeholder="Ej. Snorkel Isla Tortuga" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="tipo" required>
                <option value="grupal">Grupal</option>
                <option value="privado">Privado</option>
                <option value="mixto">Mixto</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Tarifa individual ($)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="tarifa_individual" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tarifa con transporte ($)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="tarifa_con_transporte">
            </div>
            <div class="mb-3">
              <label class="form-label">Duración (horas)</label>
              <input type="number" min="1" class="form-control" id="duracion_horas" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Incluye (separado por comas)</label>
              <input type="text" class="form-control" id="incluye" placeholder="snorkel, almuerzo, guía bilingüe">
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="activo" checked>
              <label class="form-check-label" for="activo">Activo</label>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" id="btnGuardar" class="btn btn-teal">Guardar</button>
              <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="table-responsive panel-form">
          <table class="table tabla-rolvin align-middle">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Tarifa</th>
                <th>Duración</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaTours"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/model/toursModel.js"></script>
  <script src="../js/tours.js"></script>
</body>
</html>
