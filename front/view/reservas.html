    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">
</head>

        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-water"></i>
                Rolvin Tours
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRolvin"
                aria-controls="navRolvin" aria-expanded="false" aria-label="Menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navRolvin">

                <div class="navbar-nav ms-auto gap-lg-3">
                    <a class="nav-link" href="tours.html">Tours</a>

                    <a class="nav-link" href="vendedores.html">Vendedores</a>

                    <a class="nav-link active" href="reservas.html">Reservas</a>
                    <a class="nav-link" href="salidasOperaciones.html">Operaciones</a>
                    <a class="nav-link" href="costosVariables.html">Costos variables</a>

        </div>
    </nav>

    <div class="container">

        <h2 class="mb-4">
            <i class="bi bi-calendar-check"></i>
            Gestión de Reservas
        </h2>

        <div id="zonaAlertas"></div>

        <div class="row g-4">

            <div class="col-lg-4">
                <div class="panel-form">

                    <h5 id="tituloFormulario" class="mb-3">

                        Nueva reserva
                    </h5>

                    <form id="formReserva">

                        <div class="mb-3">
                            <label for="cliente_id" class="form-label">

                                Cliente
                            </label>

                            <select class="form-select" id="cliente_id" required>

                                <option value="" selected disabled>
                                    Seleccione un cliente
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tour_id" class="form-label">

                                Tour
                            </label>

                            <select class="form-select" id="tour_id" required>

                                <option value="" selected disabled>
                                    Seleccione un tour
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="canal_venta" class="form-label">

                                Canal de venta
                            </label>

                            <select class="form-select" id="canal_venta" required>

                                <option value="web">
                                    Venta web
                                </option>

                                <option value="presencial">
                                    Venta presencial
                                </option>

                                <option value="vendedor_externo">
                                    Vendedor externo
                                </option>

                                <option value="hotel_asociado">
                                    Hotel o alojamiento asociado
                                </option>
                            </select>
                        </div>

                        <div class="mb-3 d-none" id="contenedorVendedor">

                            <label for="vendedor_id" class="form-label">

                                Vendedor o aliado
                            </label>

                            <select class="form-select" id="vendedor_id">

                                <option value="">
                                    Seleccione un vendedor
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="cantidad_personas" class="form-label">

                                Cantidad de personas
                            </label>

                            <input type="number" min="1" class="form-control" id="cantidad_personas" value="1" required>
                        </div>

                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label for="monto_total" class="form-label">

                                    Monto total
                                </label>

                                <input type="number" min="0" step="0.01" class="form-control" id="monto_total"
                                    placeholder="Ej. 260" required>
                            </div>

                            <div class="col-md-5 mb-3">
                                <label for="moneda" class="form-label">

                                    Moneda
                                </label>

                                <select class="form-select" id="moneda" required>

                                    <option value="USD">
                                        USD
                                    </option>

                                    <option value="CRC">
                                        CRC
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estado_pago" class="form-label">

                                Estado del pago
                            </label>

                            <select class="form-select" id="estado_pago" required>

                                <option value="pendiente">
                                    Pendiente
                                </option>

                                <option value="parcial">
                                    Pago parcial
                                </option>

                                <option value="pagado">
                                    Pagado
                                </option>

                                <option value="cancelado">
                                    Cancelado
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_reserva" class="form-label">

                                Fecha de reserva
                            </label>

                            <input type="date" class="form-control" id="fecha_reserva" required>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_tour" class="form-label">

                                Fecha del tour
                            </label>

                            <input type="date" class="form-control" id="fecha_tour" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="btnGuardar" class="btn btn-teal">

                                Guardar
                            </button>

                            <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">

                                Cancelar
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="table-responsive panel-form">

                    <table class="table tabla-rolvin align-middle">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Tour</th>
                                <th>Canal</th>
                                <th>Personas</th>
                                <th>Total</th>
                                <th>Fecha tour</th>
                                <th>Pago</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaReservas"></tbody>
                    </table>

                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/config.js"></script>

    <script src="/js/model/reservasModel.js"></script>

    <script src="/js/reservas.js"></script>

</body>

</html>
