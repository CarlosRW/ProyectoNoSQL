  <link href="../css/style.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-rolvin mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-water"></i> Rolvin Tours</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRolvin"
        aria-controls="navRolvin" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navRolvin">
        <div class="navbar-nav ms-auto gap-lg-3">
          <a class="nav-link" href="tours.html">Tours</a>
          <a class="nav-link" href="clientes.html">Clientes</a>
          <a class="nav-link" href="vendedores.html">Vendedores</a>

        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4"><i class="bi bi-cash-coin"></i> Gestión de Costos Variables</h2>

    <div id="zonaAlertas"></div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="panel-form">
          <h5 id="tituloFormulario" class="mb-3">Nuevo costo variable</h5>
          <form id="formCostoVariable">
            <div class="mb-3">
              <label for="tipo_costo" class="form-label">Tipo de costo</label>
              <select class="form-select" id="tipo_costo" required>
                <option value="" selected disabled>Seleccione un tipo de costo</option>
                <option value="combustible">Combustible</option>
                <option value="mantenimiento">Mantenimiento</option>
                <option value="insumos">Insumos</option>
                <option value="personal_temporal">Personal temporal</option>
                <option value="comisiones_terceros">Comisiones a terceros</option>
                <option value="otros">Otros</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="salida_id" class="form-label">Salida u operación</label>
              <select class="form-select" id="salida_id" required>
                <option value="" selected disabled>Seleccione una salida</option>
              </select>
            </div>

            <div class="row">
              <div class="col-md-7 mb-3">
                <label for="monto" class="form-label">Monto</label>
                <input type="number" min="0" step="0.01" class="form-control" id="monto" placeholder="Ej. 85000" required>
              </div>
              <div class="col-md-5 mb-3">
                <label for="moneda" class="form-label">Moneda</label>
                <select class="form-select" id="moneda" required>
                  <option value="CRC">CRC</option>
                  <option value="USD">USD</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" required>
            </div>

            <div class="mb-3">
              <label for="responsable_registro" class="form-label">Responsable del registro</label>
              <input type="text" class="form-control" id="responsable_registro" placeholder="Ej. Nataly Camareno" required>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" id="btnGuardar" class="btn btn-teal">Guardar</button>
              <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="table-responsive panel-form">
          <table class="table tabla-rolvin align-middle">
            <thead>
              <tr>
                <th>Tipo de costo</th>
                <th>Salida</th>
                <th>Monto</th>
                <th>Fecha</th>
                <th>Responsable</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaCostosVariables"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/model/costosVariablesModel.js"></script>
  <script src="../js/costosVariables.js"></script>
</body>

</html>
